name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install uv
        run: pip install uv
      
      - name: Install dependencies
        working-directory: ./apps/core
        run: uv sync
      
      - name: Run linter
        working-directory: ./apps/core
        run: uv run ruff check .
      
      - name: Run type checker
        working-directory: ./apps/core
        run: uv run mypy .
      
      - name: Run tests
        working-directory: ./apps/core
        run: uv run pytest --cov

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install pnpm
        run: npm install -g pnpm
      
      - name: Install dependencies
        run: pnpm install
      
      - name: Run linter
        run: pnpm lint
      
      - name: Run type checker
        run: pnpm typecheck
      
      - name: Run tests
        run: pnpm test
      
      - name: Build
        run: pnpm build
