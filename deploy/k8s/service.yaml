apiVersion: v1
kind: Service
metadata:
  name: tempus-api
  labels:
    app: tempus
    component: api
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
  selector:
    app: tempus
    component: api
---
apiVersion: v1
kind: Service
metadata:
  name: tempus-api-internal
  labels:
    app: tempus
    component: api
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
  selector:
    app: tempus
    component: api
