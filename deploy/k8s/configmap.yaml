apiVersion: v1
kind: ConfigMap
metadata:
  name: tempus-config
  labels:
    app: tempus
data:
  TEMPUS_ENV: "production"
  LOG_LEVEL: "INFO"
  DATABASE_SSL_MODE: "require"
  ALLOWED_ORIGINS: "https://tempus.ai,https://app.tempus.ai"
  OLLAMA_HOST: "http://ollama:11434"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  labels:
    app: postgres
data:
  POSTGRES_DB: "tempus"
  POSTGRES_USER: "tempus"
  POSTGRES_INITDB_ARGS: "-E UTF8"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  labels:
    app: redis
data:
  redis.conf: |
    maxmemory 256mb
    maxmemory-policy allkeys-lru
    appendonly yes
    appendfsync everysec
    save 900 1
    save 300 10
    save 60 10000
